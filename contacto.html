<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contacto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Contacto</h1>
        <p>Escríbeme un mensaje.</p>
    </header>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="contacto.html">Contacto</a>
    </nav>

    <main>
        <section class="tarjeta">
            <h2>Formulario</h2>
            <form>
                <label for="nombre">Tu nombre:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre">

                <label for="correo">Tu correo:</label>
                <input type="email" id="correo" name="correo" placeholder="nombre@correo.com">

                <label for="mensaje">Tu mensaje:</label>
                <textarea id="mensaje" name="mensaje" rows="4" placeholder="Escribe aquí..."></textarea>

                <button type="submit">Enviar</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Hecho por mí, aprendiendo cada día.</p>
    </footer>

</body>
</html>
